name: Instagram Autopilot Scheduler
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-autopilot-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify scheduler configuration
        env:
          CRON_SECRET: ${{ secrets.INSTA_AUTOPILOT_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set INSTA_AUTOPILOT_CRON_SECRET to the same value as Vercel CRON_SECRET."
            exit 1
          fi
      - name: Execute due publication tick
        env:
          CRON_SECRET: ${{ secrets.INSTA_AUTOPILOT_CRON_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 110 --output /tmp/response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header 'Cache-Control: no-store' \
            'https://insta-social-ai.vercel.app/api/cron/instagram-autopilot')
          cat /tmp/response.json
          if [ "$code" -ne 200 ]; then
            echo "::error::Autopilot worker returned HTTP $code"
            exit 1
          fi
